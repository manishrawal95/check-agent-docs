[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "check-agent-docs"
version = "0.6.0"
description = "Find claims in CLAUDE.md, AGENTS.md and Cursor/Copilot rules that no longer match your repo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["claude", "agents", "lint", "cursor", "copilot", "documentation"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
check-agent-docs = "check_agent_docs:main_entry"

[tool.setuptools]
py-modules = ["check_agent_docs"]
